[build-system]
requires = ["setuptools>=80"]
build-backend = "setuptools.build_meta"

[project]
name = "zoom2txt"
version = "2.7.1"
description = "Desktop automation from academic Zoom recordings to verified TXT transcripts."
readme = "README.md"
requires-python = ">=3.12,<3.15"
license = { file = "LICENSE" }
authors = [{ name = "MACOABC" }]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Win32 (MS Windows)",
  "Intended Audience :: Education",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3.12",
]
dependencies = [
  "PySide6==6.11.1",
  "requests==2.34.2",
  "keyring==25.7.0",
  "platformdirs==4.10.0",
  "google-api-python-client==2.198.0",
  "google-auth==2.55.1",
  "google-auth-oauthlib==1.4.0",
  "cryptography==50.0.0",
  "tzdata==2026.3",
  "yt-dlp==2026.7.4",
]

[tool.ruff]
target-version = "py312"
line-length = 100
exclude = ["build*", "dist*", ".venv"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S"]
ignore = [
  "E501", # Ruff's formatter intentionally leaves long strings and Qt style rules intact.
  "S101", # Assertions are the native unittest API.
  "S105", # Synthetic fixture strings deliberately exercise secret handling.
  "S106", # Synthetic fixture passwords are not credentials.
  "S603", # Subprocess arguments are constructed internally and never use a shell.
]

[tool.ruff.lint.per-file-ignores]
"tests/*.py" = ["E402", "S108", "S311"]
"scripts/*.py" = ["S310"]
"scripts/capture_portfolio.py" = ["E402"]
